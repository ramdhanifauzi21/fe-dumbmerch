apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-dumbmerch
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fe-dumbmerch
  template:
    metadata:
      labels:
        app: fe-dumbmerch
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: fe-dumbmerch
          image: registry.fauzi.studentdumbways.my.id/fe-dumbmerch:production-5087c8a
          ports:
            - containerPort: 8080
          env:
            - name: REACT_APP_BASEURL
              value: "https://api.fauzi.studentdumbways.my.id/api/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: fe-dumbmerch-service
  namespace: production
spec:
  selector:
    app: fe-dumbmerch
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fe-dumbmerch-ingress
  namespace: production
spec:
  ingressClassName: nginx
  rules:
    - host: fauzi.studentdumbways.my.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-dumbmerch-service
                port:
                  number: 80
